<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentation Player</title>
    
    <!-- 1. Load the Plyr CSS (The Styles) -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <style>
        /* Reset margins to prevent scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: transparent; /* Seamless with Notion */
            overflow: hidden; /* FORCE disable scrollbars */
            display: flex;
            align-items: center; /* Vertically center */
            justify-content: center; /* Horizontally center */
        }

        /* The container for the player */
        .container {
            width: 100%;
            /* This ensures the video never exceeds the Notion block height */
            max-height: 100vh; 
            aspect-ratio: 16/9; /* Default aspect ratio */
        }

        /* Customizing Plyr to look like Notion */
        .plyr {
            height: 100%;
            width: 100%;
            border-radius: 8px;
            --plyr-color-main: #2eaadc; /* You can change the progress bar color here */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 2. The Video Element -->
        <video id="player" playsinline controls data-poster="cpp.jpg?text=Video+Preview">
            <!-- REPLACE THE LINK BELOW WITH YOUR VIDEO LINK -->
            <source src="cbpres.mp4" type="video/mp4" />
        </video>
    </div>

    <!-- 3. Load the Plyr JS (The Logic) -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        // Initialize the player
        const player = new Plyr('#player', {
            controls: [
                'play-large', // The big play button in the center
                'play',       // Play/pause playback
                'progress',   // The progress bar and scrubber
                'current-time', // The current time of playback
                'mute',       // Toggle mute
                'volume',     // Volume control
                'fullscreen'  // Toggle fullscreen
            ]
        });

        // Dynamic Resizing Logic
        // This Javascript listens for window resize events (when you drag the Notion block)
        // and ensures the player fits without scrolling.
        window.addEventListener('resize', () => {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        });
    </script>
</body>
</html>
